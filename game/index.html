<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN YASEEN'S EXTREME RACER</title>
    <style>
        /* ===== BASE STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Orbitron', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }
        
        @font-face {
            font-family: 'Orbitron';
            src: url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        }

        /* ===== ENHANCED INTRO ANIMATION ===== */
        #intro-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOut 1s 5s forwards;
        }
        
        #presentation-text {
            font-size: 2.5rem;
            color: #ff9900;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.7);
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 0.5s 0.5s forwards, floatUp 1s 3s forwards;
        }
        
        #intro-text {
            font-size: 5rem;
            background: linear-gradient(90deg, #ff0000, #ffff00, #ff0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            margin-bottom: 2rem;
            opacity: 0;
            transform: scale(0.5);
            animation: 
                glow 1.5s infinite alternate,
                fadeInScale 1s 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275),
                shake 0.5s 2s forwards;
        }
        
        #subtitle {
            font-size: 2rem;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
            opacity: 0;
            animation: fadeIn 0.5s 2.5s forwards;
        }
        
        .racing-stripes {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 20px,
                rgba(255, 255, 0, 0.2) 20px,
                rgba(255, 255, 0, 0.2) 40px
            );
            opacity: 0;
            animation: fadeIn 0.5s 0.2s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes fadeInScale {
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes glow {
            0% { text-shadow: 0 0 30px rgba(255, 0, 0, 0.7); }
            100% { text-shadow: 0 0 50px rgba(255, 255, 0, 0.9); }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes floatUp {
            to { transform: translateY(-50px); opacity: 0; }
        }

        /* ===== GAME CONTAINER ===== */
        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Road */
        #road {
            position: absolute;
            width: 80%;
            max-width: 400px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            background-image: 
                linear-gradient(transparent 95%, #fff 95%),
                linear-gradient(90deg, #ff0 15%, transparent 15%, transparent 85%, #ff0 85%);
            background-size: 60px 60px;
            animation: roadMove 0.5s linear infinite;
        }
        
        @keyframes roadMove {
            from { background-position: 0 0; }
            to { background-position: 0 60px; }
        }

        /* Cars */
        #player-car {
            position: absolute;
            width: 12vw;
            max-width: 60px;
            height: 20vw;
            max-height: 100px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100"><defs><linearGradient id="playerGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="%23ff0000"/><stop offset="50%" stop-color="%23cc0000"/><stop offset="100%" stop-color="%23ff0000"/></linearGradient></defs><rect x="5" y="20" width="50" height="60" fill="url(%23playerGrad)"/><rect x="10" y="10" width="40" height="10" fill="url(%23playerGrad)"/><circle cx="15" cy="80" r="10" fill="%23000"/><circle cx="45" cy="80" r="10" fill="%23000"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.1s;
        }
        
        .enemy-car {
            position: absolute;
            width: 12vw;
            max-width: 60px;
            height: 20vw;
            max-height: 100px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100"><defs><linearGradient id="enemyGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="%230000ff"/><stop offset="50%" stop-color="%230088ff"/><stop offset="100%" stop-color="%230000ff"/></linearGradient></defs><rect x="5" y="20" width="50" height="60" fill="url(%23enemyGrad)"/><rect x="10" y="10" width="40" height="10" fill="url(%23enemyGrad)"/><circle cx="15" cy="80" r="10" fill="%23000"/><circle cx="45" cy="80" r="10" fill="%23000"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 9;
        }

        /* Power-ups */
        .bomb {
            position: absolute;
            width: 8vw;
            max-width: 40px;
            height: 8vw;
            max-height: 40px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="%23ff0000"/><circle cx="20" cy="20" r="15" fill="%23ff3333"/><circle cx="20" cy="20" r="10" fill="%23ff6666"/><rect x="15" y="5" width="10" height="5" fill="%23000"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 8;
            animation: float 2s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Explosion Effect */
        .explosion {
            position: absolute;
            width: 150px;
            height: 150px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="explodeGrad"><stop offset="0%" stop-color="%23ffff00"/><stop offset="50%" stop-color="%23ff8800"/><stop offset="100%" stop-color="%23ff0000"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="url(%23explodeGrad)"/></svg>');
            background-size: contain;
            animation: explode 0.8s forwards;
            z-index: 15;
            pointer-events: none;
        }
        
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; filter: brightness(3); }
            70% { transform: scale(1.5); opacity: 0.8; filter: brightness(2); }
            100% { transform: scale(2); opacity: 0; filter: brightness(1); }
        }

        /* UI Elements */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        
        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 4vw;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 1vw 2vw;
            border-radius: 10px;
            border: 1px solid #00ffff;
        }
        
        #bomb-count {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 4vw;
            color: #fff;
            text-shadow: 0 0 10px #ff0000;
            background: rgba(0, 0, 0, 0.5);
            padding: 1vw 2vw;
            border-radius: 10px;
            border: 1px solid #ff0000;
        }

        /* Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 25;
        }
        
        .control-btn {
            width: 15vw;
            height: 15vw;
            max-width: 80px;
            max-height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 8vw;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            pointer-events: auto;
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
        }
        
        .btn {
            padding: 3vw 6vw;
            font-size: 4vw;
            background: linear-gradient(45deg, #00ff00, #00aa00);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #0f0;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Enhanced Intro Animation -->
    <div id="intro-animation">
        <div class="racing-stripes"></div>
        <div id="presentation-text">HASSAN YASEEN PRESENTS</div>
        <div id="intro-text">EXTREME RACER</div>
        <div id="subtitle">HIGH SPEED ADVENTURE</div>
    </div>
    
    <!-- Game Container -->
    <div id="game-container">
        <div id="road"></div>
        <div id="player-car"></div>
        
        <div id="game-ui">
            <div id="score-display">SCORE: <span id="score">0</span></div>
            <div id="bomb-count">BOMBS: <span id="bombs">0</span></div>
        </div>
        
        <div id="controls">
            <div class="control-btn" id="left-btn">←</div>
            <div class="control-btn" id="right-btn">→</div>
        </div>
        
        <div id="game-over">
            <h1>GAME OVER</h1>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game State
        const state = {
            playerX: 0,
            score: 0,
            bombs: 0,
            gameSpeed: 5,
            isGameRunning: false,
            roadLeft: 0,
            roadWidth: 0,
            enemies: [],
            powerups: [],
            intervals: []
        };

        // DOM Elements
        const elements = {
            playerCar: document.getElementById('player-car'),
            road: document.getElementById('road'),
            scoreDisplay: document.getElementById('score'),
            bombDisplay: document.getElementById('bombs'),
            gameOverScreen: document.getElementById('game-over'),
            leftBtn: document.getElementById('left-btn'),
            rightBtn: document.getElementById('right-btn'),
            restartBtn: document.getElementById('restart-btn')
        };

        // Initialize Game
        function initGame() {
            // Reset state
            state.score = 0;
            state.bombs = 0;
            state.gameSpeed = 5;
            state.isGameRunning = true;
            state.enemies = [];
            state.powerups = [];
            
            // Clear all intervals
            state.intervals.forEach(clearInterval);
            state.intervals = [];
            
            // Remove all enemies and powerups
            document.querySelectorAll('.enemy-car, .bomb, .explosion').forEach(el => el.remove());
            
            // Calculate road position
            const roadRect = elements.road.getBoundingClientRect();
            state.roadLeft = roadRect.left;
            state.roadWidth = roadRect.width;
            state.playerX = state.roadLeft + state.roadWidth / 2;
            updatePlayerPosition();
            
            // Update UI
            elements.scoreDisplay.textContent = state.score;
            elements.bombDisplay.textContent = state.bombs;
            elements.gameOverScreen.style.display = 'none';
            
            // Start game loops
            state.intervals.push(setInterval(updateGame, 20));
            state.intervals.push(setInterval(spawnEnemy, 1000));
            state.intervals.push(setInterval(spawnBomb, 5000));
            
            // Setup controls
            setupControls();
        }
        
        function setupControls() {
            // Clear existing listeners
            elements.leftBtn.onmousedown = null;
            elements.leftBtn.ontouchstart = null;
            elements.rightBtn.onmousedown = null;
            elements.rightBtn.ontouchstart = null;
            document.onmouseup = null;
            document.ontouchend = null;
            elements.restartBtn.onclick = null;
            document.onkeydown = null;
            
            // Mouse/Touch controls
            elements.leftBtn.onmousedown = moveLeft;
            elements.leftBtn.ontouchstart = moveLeft;
            elements.rightBtn.onmousedown = moveRight;
            elements.rightBtn.ontouchstart = moveRight;
            
            document.onmouseup = stopMoving;
            document.ontouchend = stopMoving;
            
            // Keyboard controls
            document.onkeydown = handleKeyPress;
            
            // Restart button
            elements.restartBtn.onclick = initGame;
        }
        
        function spawnEnemy() {
            if (!state.isGameRunning) return;
            
            const enemy = document.createElement('div');
            enemy.className = 'enemy-car';
            
            // Random lane (left, middle, right)
            const lane = Math.floor(Math.random() * 3);
            let enemyLeft;
            
            switch(lane) {
                case 0: enemyLeft = state.roadLeft + state.roadWidth * 0.2; break;
                case 1: enemyLeft = state.roadLeft + state.roadWidth * 0.45; break;
                case 2: enemyLeft = state.roadLeft + state.roadWidth * 0.7; break;
            }
            
            enemy.style.left = enemyLeft + 'px';
            enemy.style.top = '-100px';
            document.body.appendChild(enemy);
            
            // Store enemy reference
            const enemyData = {
                element: enemy,
                y: -100,
                speed: state.gameSpeed,
                interval: setInterval(() => moveEnemy(enemyData), 20)
            };
            
            state.enemies.push(enemyData);
        }
        
        function spawnBomb() {
            if (!state.isGameRunning || Math.random() > 0.5) return;
            
            const bomb = document.createElement('div');
            bomb.className = 'bomb';
            
            // Random position on road
            const bombLeft = state.roadLeft + 20 + Math.random() * (state.roadWidth - 40);
            bomb.style.left = bombLeft + 'px';
            bomb.style.top = '-40px';
            document.body.appendChild(bomb);
            
            // Store bomb reference
            const bombData = {
                element: bomb,
                y: -40,
                speed: 3,
                interval: setInterval(() => moveBomb(bombData), 20)
            };
            
            state.powerups.push(bombData);
        }
        
        function moveEnemy(enemy) {
            if (!state.isGameRunning) {
                clearInterval(enemy.interval);
                return;
            }
            
            enemy.y += enemy.speed;
            enemy.element.style.top = enemy.y + 'px';
            
            // Check collision
            const playerRect = elements.playerCar.getBoundingClientRect();
            const enemyRect = enemy.element.getBoundingClientRect();
            
            if (playerRect.right > enemyRect.left && 
                playerRect.left < enemyRect.right &&
                playerRect.bottom > enemyRect.top && 
                playerRect.top < enemyRect.bottom) {
                gameOver();
            }
            
            // Remove when out of screen
            if (enemy.y > window.innerHeight) {
                clearInterval(enemy.interval);
                enemy.element.remove();
                state.score += 5;
                elements.scoreDisplay.textContent = state.score;
                state.enemies = state.enemies.filter(e => e !== enemy);
            }
        }
        
        function moveBomb(bomb) {
            if (!state.isGameRunning) {
                clearInterval(bomb.interval);
                return;
            }
            
            bomb.y += bomb.speed;
            bomb.element.style.top = bomb.y + 'px';
            
            // Check collection
            const playerRect = elements.playerCar.getBoundingClientRect();
            const bombRect = bomb.element.getBoundingClientRect();
            
            if (playerRect.right > bombRect.left && 
                playerRect.left < bombRect.right &&
                playerRect.bottom > bombRect.top && 
                playerRect.top < bombRect.bottom) {
                collectBomb(bomb);
            }
            
            // Remove when out of screen
            if (bomb.y > window.innerHeight) {
                clearInterval(bomb.interval);
                bomb.element.remove();
                state.powerups = state.powerups.filter(b => b !== bomb);
            }
        }
        
        function collectBomb(bomb) {
            clearInterval(bomb.interval);
            bomb.element.remove();
            state.powerups = state.powerups.filter(b => b !== bomb);
            
            state.bombs++;
            elements.bombDisplay.textContent = state.bombs;
            
            // Show collection effect
            const effect = document.createElement('div');
            effect.className = 'explosion';
            effect.style.left = (parseInt(bomb.element.style.left) - 55) + 'px';
            effect.style.top = (parseInt(bomb.element.style.top) - 55) + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
        }
        
        function useBomb() {
            if (state.bombs > 0 && state.isGameRunning) {
                state.bombs--;
                elements.bombDisplay.textContent = state.bombs;
                
                // Create explosion
                const explosion = document.createElement('div');
                explosion.className = 'explosion';
                const playerRect = elements.playerCar.getBoundingClientRect();
                explosion.style.left = (playerRect.left - 55) + 'px';
                explosion.style.bottom = (window.innerHeight - playerRect.top - 55) + 'px';
                document.body.appendChild(explosion);
                
                // Destroy nearby enemies
                state.enemies.forEach(enemy => {
                    const enemyRect = enemy.element.getBoundingClientRect();
                    const distance = Math.sqrt(
                        Math.pow(enemyRect.left - playerRect.left, 2) +
                        Math.pow(enemyRect.top - playerRect.top, 2)
                    );
                    
                    if (distance < 150) {
                        clearInterval(enemy.interval);
                        enemy.element.remove();
                        state.score += 20;
                        elements.scoreDisplay.textContent = state.score;
                        state.enemies = state.enemies.filter(e => e !== enemy);
                    }
                });
                
                setTimeout(() => explosion.remove(), 800);
            }
        }
        
        function updateGame() {
            // Increase difficulty
            if (state.score > 0 && state.score % 500 === 0) {
                state.gameSpeed += 0.5;
            }
        }
        
        function gameOver() {
            state.isGameRunning = false;
            
            // Clear all intervals
            state.intervals.forEach(clearInterval);
            state.intervals = [];
            
            // Clear enemies and powerups
            state.enemies.forEach(enemy => {
                clearInterval(enemy.interval);
                enemy.element.remove();
            });
            
            state.powerups.forEach(powerup => {
                clearInterval(powerup.interval);
                powerup.element.remove();
            });
            
            state.enemies = [];
            state.powerups = [];
            
            // Show game over screen
            elements.gameOverScreen.style.display = 'flex';
        }
        
        function updatePlayerPosition() {
            elements.playerCar.style.left = state.playerX + 'px';
        }
        
        function moveLeft() {
            if (!state.isGameRunning) return;
            const minX = state.roadLeft + 20;
            if (state.playerX > minX) {
                state.playerX -= 5;
                updatePlayerPosition();
                elements.playerCar.style.transform = 'rotate(-5deg)';
            }
        }
        
        function moveRight() {
            if (!state.isGameRunning) return;
            const maxX = state.roadLeft + state.roadWidth - 20;
            if (state.playerX < maxX) {
                state.playerX += 5;
                updatePlayerPosition();
                elements.playerCar.style.transform = 'rotate(5deg)';
            }
        }
        
        function stopMoving() {
            elements.playerCar.style.transform = 'rotate(0)';
        }
        
        function handleKeyPress(e) {
            if (!state.isGameRunning) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case ' ':
                    useBomb();
                    break;
            }
        }
        
        // Start the game after intro animation
        setTimeout(initGame, 5000);
    </script>
</body>
</html>
